server.port=8080

# Banco H2 em arquivo local para persistir dados entre reinicializações
spring.datasource.url=jdbc:h2:file:./dados/motoflow_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console H2 para inspecionar tabelas via navegador em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
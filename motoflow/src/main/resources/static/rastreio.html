<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhamento de OS - MotoFlow Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #121418; color: #d1d5db; }
        .panel { background-color: #1a1c23; border: 1px solid #2d333f; }
        .input-dark { background-color: #121418; border: 1px solid #2d333f; color: #f3f4f6; }
        .input-dark:focus { border-color: #dc2626; outline: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="panel rounded-xl p-6 max-w-xl w-full shadow-2xl border-t-4 border-t-red-600 space-y-6">
        
        <!-- Cabeçalho -->
        <div class="text-center border-b border-[#2d333f] pb-4">
            <h1 class="text-2xl font-black text-white tracking-wider">MOTOFLOW <span class="text-red-600">PRO</span></h1>
            <p class="text-xs text-slate-400 mt-1 uppercase font-semibold">Portal de Autoatendimento do Cliente</p>
        </div>

        <!-- Formulário de Consulta -->
        <div class="space-y-3">
            <label class="block text-xs uppercase text-slate-400 font-bold">Digite a Placa do Veículo:</label>
            <div class="flex gap-2">
                <input type="text" id="inputPlacaRastreio" placeholder="Ex: ABC1D23" class="input-dark w-full rounded p-3 text-sm uppercase font-bold text-amber-400 font-mono tracking-wider">
                <button onclick="buscarOSRastreio()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-3 rounded text-xs uppercase shadow transition">Consultar</button>
            </div>
        </div>

        <!-- Área de Resultados (Oculta inicialmente) -->
        <div id="resultadoRastreio" class="hidden space-y-5">
            
            <!-- Bloco de Dados Principais -->
            <div class="bg-[#121418] border border-[#2d333f] rounded-lg p-4 space-y-3 text-xs">
                <div class="flex justify-between items-center border-b border-[#2d333f] pb-2">
                    <span class="text-slate-400 font-bold uppercase">Código da OS:</span>
                    <span id="rstCodigo" class="font-mono text-amber-400 font-bold text-sm"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-bold uppercase">Cliente:</span>
                    <span id="rstCliente" class="text-white font-bold uppercase"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-bold uppercase">Veículo:</span>
                    <span id="rstMoto" class="text-white uppercase font-bold"></span>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-[#2d333f]">
                    <span class="text-slate-400 font-bold uppercase">Status Atual:</span>
                    <span id="rstStatus" class="px-3 py-1 rounded text-[11px] font-black uppercase tracking-wider"></span>
                </div>
            </div>

            <!-- Aviso de Moto Pronta -->
            <div id="boxMotoProntaAviso" class="hidden bg-emerald-950/60 border border-emerald-500/50 rounded-lg p-4 text-center space-y-2">
                <p class="text-xs font-bold text-emerald-400 uppercase tracking-wide">🎉 Sua moto está PRONTA para retirada!</p>
                <a id="btnZapRastreio" href="#" target="_blank" class="block bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-3 rounded text-xs uppercase transition shadow">
                    💬 Falar com a Oficina no WhatsApp
                </a>
            </div>

            <!-- Tabela Detalhada de Itens e Serviços -->
            <div class="space-y-2">
                <h3 class="text-xs uppercase text-slate-400 font-bold">Serviços e Peças Lançados:</h3>
                <div class="overflow-x-auto bg-[#121418] rounded border border-[#2d333f]">
                    <table class="w-full text-left text-xs">
                        <thead class="text-red-500 uppercase border-b border-[#2d333f]">
                            <tr>
                                <th class="p-2.5">Descrição</th>
                                <th class="p-2.5 text-center">Qtd</th>
                                <th class="p-2.5 text-right">Total</th>
                            </tr>
                        </thead>
                        <tbody id="rstTabelaItens" class="divide-y divide-[#2d333f] text-slate-300"></tbody>
                    </table>
                </div>
            </div>

            <!-- Rodapé com Valor Total -->
            <div class="flex justify-between items-center bg-[#121418] p-3.5 rounded-lg border border-[#2d333f]">
                <span class="text-xs uppercase text-slate-300 font-bold">Valor Total da OS:</span>
                <span class="text-xl font-mono font-black text-emerald-400" id="rstValorTotal">R$ 0,00</span>
            </div>

            <!-- Botão de Download / Impressão -->
            <button onclick="imprimirOSRastreio()" class="w-full bg-[#2d333f] hover:bg-[#374151] text-white font-bold py-3 rounded text-xs uppercase border border-[#4b5563] transition flex items-center justify-center gap-2 shadow">
                🖨️ Baixar / Imprimir Ordem de Serviço
            </button>
        </div>

    </div>

    <script>
        let osAtivaRastreio = null;

        const statusNomes = {
            'ORCAMENTO': 'Orçamento em Andamento',
            'RECEBIDA': 'Moto Recebida na Oficina',
            'AGUARDANDO_PECAS': 'Aguardando Chegada de Peças',
            'EM_MANUTENCAO': 'Em Manutenção na Bancada',
            'PRONTA': 'Moto Pronta / Liberada!',
            'FINALIZADA': 'Serviço Concluído e Entregue'
        };

        // Auto-executa a busca caso o link venha com a placa na URL (?placa=ABC1D23)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const placaUrl = urlParams.get('placa');
            if (placaUrl) {
                document.getElementById('inputPlacaRastreio').value = placaUrl;
                buscarOSRastreio();
            }
        };

        async function buscarOSRastreio() {
            const rawPlaca = document.getElementById('inputPlacaRastreio').value;
            const placa = rawPlaca.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            
            if (!placa) { alert("Digite a placa para consultar."); return; }

            try {
                const res = await fetch(`/api/os/public/rastreio?placa=${placa}`);
                if (res.ok) {
                    const dados = await res.json();
                    osAtivaRastreio = Array.isArray(dados) ? dados[0] : dados;
                    if (!osAtivaRastreio) { alert("Nenhuma Ordem de Serviço ativa encontrada para esta placa."); return; }

                    document.getElementById('rstCodigo').innerText = "#" + osAtivaRastreio.codigoRastreio;
                    document.getElementById('rstCliente').innerText = osAtivaRastreio.cliente ? osAtivaRastreio.cliente.nome : 'N/D';
                    document.getElementById('rstMoto').innerText = `${osAtivaRastreio.moto.modelo} (${osAtivaRastreio.moto.placa})`;
                    document.getElementById('rstValorTotal').innerText = `R$ ${(osAtivaRastreio.valorTotal || 0).toFixed(2)}`;
                    
                    const stEl = document.getElementById('rstStatus');
                    const statusKey = osAtivaRastreio.status;
                    stEl.innerText = statusNomes[statusKey] || statusKey.replace(/_/g, ' ');
                    
                    const estaPronta = (statusKey === 'PRONTA' || statusKey === 'PRONTO');
                    stEl.className = `px-3 py-1 rounded text-[11px] font-black uppercase tracking-wider ${estaPronta ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`;

                    // Preenche a tabela de itens
                    const tbody = document.getElementById('rstTabelaItens');
                    tbody.innerHTML = '';
                    if (osAtivaRastreio.itens && osAtivaRastreio.itens.length > 0) {
                        osAtivaRastreio.itens.forEach(i => {
                            const sub = (i.quantidade || 1) * (i.valorUnitario || 0);
                            tbody.innerHTML += `
                                <tr>
                                    <td class="p-2.5 uppercase text-white font-medium">${i.descricao}</td>
                                    <td class="p-2.5 text-center font-mono">${i.quantidade}x</td>
                                    <td class="p-2.5 text-right font-mono text-emerald-400">R$ ${sub.toFixed(2)}</td>
                                </tr>`;
                        });
                    } else {
                        tbody.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-slate-500 italic">Nenhum item lançado até o momento.</td></tr>`;
                    }

                    const boxPronta = document.getElementById('boxMotoProntaAviso');
                    if (estaPronta) {
                        boxPronta.classList.remove('hidden');
                        const msg = encodeURIComponent(`Olá! Vi pelo site de rastreio que minha moto ${osAtivaRastreio.moto.modelo} (${osAtivaRastreio.moto.placa}) está PRONTA! Quando posso buscar?`);
                        document.getElementById('btnZapRastreio').href = `https://wa.me/5585999990000?text=${msg}`;
                    } else {
                        boxPronta.classList.add('hidden');
                    }

                    document.getElementById('resultadoRastreio').classList.remove('hidden');
                } else {
                    alert("Nenhuma OS encontrada para esta placa.");
                }
            } catch (e) { alert("Erro ao consultar serviço."); }
        }

        function imprimirOSRastreio() {
            if (!osAtivaRastreio) { alert("Nenhuma OS selecionada para impressão."); return; }
            const win = window.open('', '_blank');
            const dataFormatted = new Date(osAtivaRastreio.dataEntrada || Date.now()).toLocaleString('pt-BR');
            const clienteNome = osAtivaRastreio.cliente ? osAtivaRastreio.cliente.nome : 'N/D';
            const motoModelo = osAtivaRastreio.moto ? osAtivaRastreio.moto.modelo : 'N/D';
            const motoPlaca = osAtivaRastreio.moto ? osAtivaRastreio.moto.placa : 'N/D';

            let itensHTML = '';
            let total = 0;
            if (osAtivaRastreio.itens && osAtivaRastreio.itens.length > 0) {
                osAtivaRastreio.itens.forEach(i => {
                    const sub = (i.quantidade || 1) * (i.valorUnitario || 0);
                    total += sub;
                    itensHTML += `
                        <tr>
                            <td style="padding:8px; border-bottom:1px solid #ddd; text-align:center;">${i.quantidade}x</td>
                            <td style="padding:8px; border-bottom:1px solid #ddd; font-weight:bold;">${i.descricao}</td>
                            <td style="padding:8px; border-bottom:1px solid #ddd; text-align:right;">R$ ${(i.valorUnitario || 0).toFixed(2)}</td>
                            <td style="padding:8px; border-bottom:1px solid #ddd; text-align:right; font-weight:bold;">R$ ${sub.toFixed(2)}</td>
                        </tr>`;
                });
            } else {
                itensHTML = `<tr><td colspan="4" style="padding:10px; text-align:center; color:#777;">Nenhum item/serviço registrado.</td></tr>`;
            }

            win.document.write(`
                <!DOCTYPE html>
                <html lang="pt-BR">
                <head>
                    <meta charset="UTF-8">
                    <title>Comprovante OS #${osAtivaRastreio.codigoRastreio}</title>
                    <style>
                        body { font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; color: #000; background: #fff; }
                        .ticket { max-width: 600px; margin: 0 auto; border: 1px solid #000; padding: 20px; }
                        .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
                        .header h2 { margin: 0; font-size: 22px; text-transform: uppercase; }
                        .header p { margin: 2px 0; font-size: 11px; }
                        .info-grid { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 15px; border-bottom: 1px dashed #000; padding-bottom: 10px; }
                        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 15px; }
                        th { background: #f0f0f0; padding: 6px; border-bottom: 2px solid #000; text-align: left; }
                        .totais { text-align: right; font-size: 14px; border-top: 2px solid #000; padding-top: 10px; }
                    </style>
                </head>
                <body>
                    <div class="ticket">
                        <div class="header">
                            <h2>MOTOFLOW PRO</h2>
                            <p>COMPROVANTE DE ACOMPANHAMENTO DE SERVIÇO</p>
                        </div>
                        <div class="info-grid">
                            <div>
                                <p><strong>CÓDIGO OS:</strong> #${osAtivaRastreio.codigoRastreio}</p>
                                <p><strong>DATA:</strong> ${dataFormatted}</p>
                            </div>
                            <div style="text-align: right;">
                                <p><strong>CLIENTE:</strong> ${clienteNome}</p>
                                <p><strong>VEÍCULO:</strong> ${motoModelo} (${motoPlaca})</p>
                            </div>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th style="width:10%; text-align:center;">Qtd</th>
                                    <th style="width:50%;">Descrição</th>
                                    <th style="width:20%; text-align:right;">Unitário</th>
                                    <th style="width:20%; text-align:right;">Total</th>
                                </tr>
                            </thead>
                            <tbody>${itensHTML}</tbody>
                        </table>
                        <div class="totais">
                            <p style="margin:0;"><strong>TOTAL GERAL: R$ ${total.toFixed(2)}</strong></p>
                        </div>
                    </div>
                    <script>
                        window.onload = function() { window.print(); }
                    <\/script>
                </body>
                </html>
            `);
            win.document.close();
        }
    </script>
</body>
</html>

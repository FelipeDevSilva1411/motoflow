<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhamento de OS - MotoFlow Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #121418; color: #d1d5db; }
        .panel { background-color: #1f232b; border: 1px solid #2d333f; }
        .input-dark { background-color: #121418; border: 1px solid #2d333f; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

    <div class="panel rounded-xl p-6 max-w-md w-full shadow-2xl border-t-4 border-t-red-600">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-white tracking-wider">MOTOFLOW <span class="text-red-600">PRO</span></h1>
            <p class="text-xs text-slate-400 mt-1 uppercase">Acompanhe o Status da Sua Moto</p>
        </div>

        <!-- Campo de Busca por Placa -->
        <div class="space-y-3 mb-6">
            <label class="block text-xs uppercase text-slate-400 font-bold">Digite a Placa do Veículo:</label>
            <div class="flex gap-2">
                <input type="text" id="inputPlacaRastreio" placeholder="Ex: ABC1D23" class="input-dark w-full rounded p-2.5 text-sm uppercase font-bold text-amber-400 font-mono">
                <button onclick="buscarOSRastreio()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2.5 rounded text-xs uppercase transition">Buscar</button>
            </div>
        </div>

        <!-- Card do Resultado da Consulta -->
        <div id="resultadoRastreio" class="hidden space-y-4">
            <div class="bg-[#121418] border border-[#2d333f] rounded-lg p-4 space-y-2 text-xs">
                <div class="flex justify-between items-center border-b border-[#2d333f] pb-2">
                    <span class="text-slate-400">Código OS:</span>
                    <span id="rstCodigo" class="font-mono text-amber-400 font-bold"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400">Cliente:</span>
                    <span id="rstCliente" class="text-white font-bold uppercase"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400">Veículo:</span>
                    <span id="rstMoto" class="text-white uppercase"></span>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-[#2d333f]">
                    <span class="text-slate-400">Status Atual:</span>
                    <span id="rstStatus" class="px-2 py-1 rounded text-[10px] font-bold uppercase"></span>
                </div>
            </div>

            <!-- Destaque para Moto PRONTA + Botão de WhatsApp -->
            <div id="boxMotoProntaAviso" class="hidden bg-emerald-950/60 border border-emerald-500/50 rounded-lg p-3 text-center space-y-2">
                <p class="text-xs font-bold text-emerald-400">🎉 Sua moto está PRONTA para retirada!</p>
                <a id="btnZapRastreio" href="#" target="_blank" class="block bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-3 rounded text-xs uppercase transition">
                    💬 Falar com a Oficina no WhatsApp
                </a>
            </div>

            <!-- Botão Imprimir OS (Corrigido) -->
            <button onclick="imprimirOSRastreio()" class="w-full bg-[#2d333f] hover:bg-[#374151] text-white font-bold py-2.5 rounded text-xs uppercase border border-[#4b5563] transition flex items-center justify-center gap-2">
                🖨️ Imprimir Ordem de Serviço
            </button>
        </div>
    </div>

    <script>
        let osAtivaRastreio = null;

        async function buscarOSRastreio() {
            const placa = document.getElementById('inputPlacaRastreio').value.trim().toUpperCase();
            if (!placa) { alert("Digite a placa para consultar."); return; }

            try {
                const res = await fetch(`/api/os/public/rastreio?placa=${placa}`);
                if (res.ok) {
                    const dados = await res.json();
                    osAtivaRastreio = Array.isArray(dados) ? dados[0] : dados;
                    if (!osAtivaRastreio) { alert("Nenhuma Ordem de Serviço encontrada para esta placa."); return; }

                    document.getElementById('rstCodigo').innerText = osAtivaRastreio.codigoRastreio;
                    document.getElementById('rstCliente').innerText = osAtivaRastreio.cliente ? osAtivaRastreio.cliente.nome : 'N/D';
                    document.getElementById('rstMoto').innerText = `${osAtivaRastreio.moto.modelo} (${osAtivaRastreio.moto.placa})`;
                    
                    const stEl = document.getElementById('rstStatus');
                    stEl.innerText = osAtivaRastreio.status.replace(/_/g, ' ');
                    
                    const estaPronta = (osAtivaRastreio.status === 'PRONTA' || osAtivaRastreio.status === 'PRONTO');
                    stEl.className = `px-2 py-1 rounded text-[10px] font-bold uppercase ${estaPronta ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`;

                    // Se estiver PRONTA, exibe o aviso verde com botão de WhatsApp
                    const boxPronta = document.getElementById('boxMotoProntaAviso');
                    if (estaPronta) {
                        boxPronta.classList.remove('hidden');
                        const msg = encodeURIComponent(`Olá! Vi pelo site de rastreio que a minha moto ${osAtivaRastreio.moto.modelo} (${osAtivaRastreio.moto.placa}) está PRONTA! Quando posso retirar?`);
                        document.getElementById('btnZapRastreio').href = `https://wa.me/5585999990000?text=${msg}`; // Coloque o numero da oficina
                    } else {
                        boxPronta.classList.add('hidden');
                    }

                    document.getElementById('resultadoRastreio').classList.remove('hidden');
                } else {
                    alert("Nenhuma OS encontrada para esta placa.");
                }
            } catch (e) { alert("Erro ao consultar serviço."); }
        }

        // Função de Impressão Corrigida para a Tela de Rastreio
        function imprimirOSRastreio() {
            if (!osAtivaRastreio) { alert("Nenhuma OS selecionada para impressão."); return; }
            const win = window.open('', '_blank');
            const dataFormatted = new Date(osAtivaRastreio.dataEntrada || Date.now()).toLocaleString('pt-BR');
            const clienteNome = osAtivaRastreio.cliente ? osAtivaRastreio.cliente.nome : 'N/D';
            const clienteTel = osAtivaRastreio.cliente ? osAtivaRastreio.cliente.telefoneWhatsapp : 'N/D';
            const motoModelo = osAtivaRastreio.moto ? osAtivaRastreio.moto.modelo : 'N/D';
            const motoPlaca = osAtivaRastreio.moto ? osAtivaRastreio.moto.placa : 'N/D';

            let itensHTML = '';
            let total = 0;
            if (osAtivaRastreio.itens && osAtivaRastreio.itens.length > 0) {
                osAtivaRastreio.itens.forEach(i => {
                    const sub = (i.quantidade || 1) * (i.valorUnitario || 0);
                    total += sub;
                    itensHTML += `
                        <tr>
                            <td style="padding:6px; border-bottom:1px solid #ddd; text-align:center;">${i.quantidade}x</td>
                            <td style="padding:6px; border-bottom:1px solid #ddd; font-weight:bold;">${i.descricao}</td>
                            <td style="padding:6px; border-bottom:1px solid #ddd; text-align:right;">R$ ${(i.valorUnitario || 0).toFixed(2)}</td>
                            <td style="padding:6px; border-bottom:1px solid #ddd; text-align:right; font-weight:bold;">R$ ${sub.toFixed(2)}</td>
                        </tr>`;
                });
            } else {
                itensHTML = `<tr><td colspan="4" style="padding:10px; text-align:center; color:#777;">Nenhum item/serviço registrado.</td></tr>`;
            }

            win.document.write(`
                <!DOCTYPE html>
                <html lang="pt-BR">
                <head>
                    <meta charset="UTF-8">
                    <title>Comprovante OS #${osAtivaRastreio.codigoRastreio}</title>
                    <style>
                        body { font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; color: #000; background: #fff; }
                        .ticket { max-width: 600px; margin: 0 auto; border: 1px solid #000; padding: 20px; }
                        .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
                        .header h2 { margin: 0; font-size: 22px; text-transform: uppercase; }
                        .header p { margin: 2px 0; font-size: 11px; }
                        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12px; margin-bottom: 15px; border-bottom: 1px dashed #000; padding-bottom: 10px; }
                        .info-block p { margin: 3px 0; }
                        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 15px; }
                        th { background: #f0f0f0; padding: 6px; border-bottom: 2px solid #000; text-align: left; }
                        .totais { text-align: right; font-size: 14px; border-top: 2px solid #000; padding-top: 10px; }
                    </style>
                </head>
                <body>
                    <div class="ticket">
                        <div class="header">
                            <h2>MOTOFLOW PRO</h2>
                            <p>OFICINA MECÂNICA ESPECIALIZADA EM MOTOCICLETAS</p>
                            <p>COMPROVANTE DE SERVIÇO</p>
                        </div>
                        <div class="info-grid">
                            <div class="info-block">
                                <p><strong>CÓDIGO OS:</strong> ${osAtivaRastreio.codigoRastreio}</p>
                                <p><strong>DATA:</strong> ${dataFormatted}</p>
                            </div>
                            <div class="info-block">
                                <p><strong>CLIENTE:</strong> ${clienteNome}</p>
                                <p><strong>VEÍCULO:</strong> ${motoModelo} (${motoPlaca})</p>
                            </div>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th style="width:10%; text-align:center;">Qtd</th>
                                    <th style="width:50%;">Descrição</th>
                                    <th style="width:20%; text-align:right;">Unitário</th>
                                    <th style="width:20%; text-align:right;">Total</th>
                                </tr>
                            </thead>
                            <tbody>${itensHTML}</tbody>
                        </table>
                        <div class="totais">
                            <p style="margin:0;"><strong>TOTAL GERAL: R$ ${total.toFixed(2)}</strong></p>
                        </div>
                    </div>
                    <script>
                        window.onload = function() { window.print(); }
                    <\/script>
                </body>
                </html>
            `);
            win.document.close();
        }
    </script>
</body>
</html>
